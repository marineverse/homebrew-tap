name: Test formula
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478
      - run: brew install --build-from-source marineverse/tap/marineverse
      - run: brew test marineverse/tap/marineverse
      - run: brew audit --strict marineverse/tap/marineverse
